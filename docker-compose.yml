# Kenpai — environnement Docker.
#   Développement : `docker compose up -d db` puis `npm run dev`.
#   Stack complète : `docker compose --profile full up --build` → http://localhost:8080
#   Le proxy Caddy sert le site et l'API sous la même origine (/api → API).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kenpai
      POSTGRES_PASSWORD: kenpai
      POSTGRES_DB: kenpai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kenpai -d kenpai"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://kenpai:kenpai@db:5432/kenpai
      API_PORT: 4000
      API_HOST: 0.0.0.0
      WEB_ORIGIN: http://localhost:8080
      # Le proxy local est en HTTP : à passer à true derrière HTTPS en production.
      COOKIE_SECURE: "false"
      # Clé RAWG lue depuis le fichier .env du projet.
      RAWG_API_KEY: ${RAWG_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # Le rendu serveur interroge l'API directement sur le réseau Docker
      # (dans le conteneur, localhost:4000 ne mène nulle part).
      API_INTERNAL_URL: http://api:4000
    depends_on:
      - api

  proxy:
    profiles: ["full"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api

volumes:
  pgdata:
